<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        #formContainer{
            display:grid;
            grid-template-rows:250px 1fr 150px;
            width:600px;
            border: 15px solid black;
            border-radius:20px;
            justify-self: center;
            margin-top:10%;
            margin-bottom:10%;
            background-color:honeydew;
            height:800px;
        }
        #background{
            background-image: url(images/jesus_feeds_5000.jpeg);
            background-size: cover;
            border-radius: 5px 5px 0 0;
            position:relative;
        }
        #closeBtn{
            margin-top:10px;
            margin-left:10px;
            border-radius:5px;
            width:23px;
            height:20px;
        }
        #closeBtn:hover{
            background-color: rgb(164, 164, 164);
            color:red;
        }
        form{
            display:grid;
            grid-template-columns:1fr 1fr;
            grid-template-rows: 70px 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
        }
        form h3{
            grid-area:1/1/2/3;
            justify-self: center;
            margin-top:20px;
            font-size: 25px;
        }
        #scriptures {
            display:flex;
           justify-content: space-between; 
        }
        #scriptures img{
            width:115px;
            
        }
        #password, #username, #email{
            height:20px;
            margin-right:10px;
        }
        label{
            margin-left:10px;
        }
        
        section{
            grid-column: 1/3;
            align-self: center;
            justify-self: center;
        }
        h1{
            justify-self: center;
            color:rgb(248, 249, 216);
            text-shadow: 2px 2px black;
            align-self: baseline;
            position: absolute;
            bottom:5px;
            left:32%;
        }
        #feed{
            bottom:50px;
            left:35%;
            font-size:2.5em;
        }
    </style>
</head>

<body>
    <div id="formContainer">
        <div id="background">
            <button type="button" id="closeBtn">X</button>
            <h1 id="feed">Daily Feed</h1>
            <h1>Scripture a Day</h1>
        </div>
        <form id="myForm">
            <h3>Sign Up for Daily Scripture Feed</h3>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
        <div id="scriptures">
            <img src="images/old_testament.webp">
            <img src="images/new_testament.webp">
            <img src="images/book_of_mormon.webp">
            <img src="images/doctrine_and_covenants.webp">
            <img src="images/pearl_of_great_price.webp">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
