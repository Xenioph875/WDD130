<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        .main{
          background-image: url(images/christus.webp);
          border: 5px solid black;
          border-radius: 5%;
          margin:50px 20%;
          max-width: 800px;
          height:700px;
        }

        .presidency{
            display:grid;
            grid-template-columns: 20% 1fr 1fr 1fr 20%;
            justify-items:center;
        }

        h1, h2{
            text-align: center;
            color:white;
            margin-bottom:5px;
        }

        .presidency a:nth-child(1){
            grid-column: 2/3; 
        }

        .apostles{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
        }
        
        .apostles a:nth-child(1){
            grid-column: 2/3;
        }

        .apostles a:nth-child(5){
            grid-column: 2/3;
        }

        .apostles a:nth-child(9){
            grid-column: 2/3;
        }

        img{
            width:100px;
            border: 5px solid white;
            border-radius:100%;
            margin-bottom:10px;
        }

        img:hover{
            transform: scale(1.25);
            opacity:0.9;
            border:3px solid rgb(162, 0, 255);
        }
        
    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div class="main">
        <!-- <img id="hero-img" src="images/christus.webp" alt="Christus"> -->
        <h1>First Presidency</h1>
        <div class="presidency">

        </div>
        <h2>The Quorum of the Twelve Apostles</h3>

            <a href="https://www.churchofjesuschrist.org/learn/quorum-of-the-twelve-apostles?lang=eng"><img src="images/uchtdorf.webp" alt="President Uchtdorf"></a>
