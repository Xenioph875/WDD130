<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="box_model.css">
</head>
<body>
    <h1>Box Model</h1>
    <p class="subtitle">Conent, padding, border, margin</p> <!--Class puts it in a category that is more specific than and element selector
    but it is meant to be reused in other palces as well-->
    <p>Page model without class modifier</p>
    <p class="subtitle">Another class element use!</p>
    <h1 id="header2">ID example on a h1</h1> <!--id gives specificity on which element to select. It is just this element that has that id-->
    <div>
        <p>Div selector</p> 
        <!-- the p element above is a block element because it takes up its own space -->
        <p>Another <span>Div</span> Selector</p>
        <!-- span element in an inline element on because it is inline -->
    </div>
</body>
</html>
