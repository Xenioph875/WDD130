<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> <!---->
        /* CSS commment */
        @import url('https://fonts.googleapis.com/css2?family=Nabla&family=Rubik+Glitch+Pop&display=swap');        
        /*calligraphr website to create your own fonts*/
        body{
            background-color:#bd44e2; /*hex code colors: #00(red)00(green)00blue 0-9, a-f(10-15)*/
        }
        h1{
           
            color:rgb(30, 210, 192); /*rgb color: (red, green, blue, opacity) 0-255*/ 
            font-family: Nabla, Times, serif;
            font-size: 75px;
            text-decoration: underline wavy hotpink 10px;
            
        }
        p{
            font-family: 'Rubik Glitch Pop', Nabla, serif;
            color:rgb(255, 255, 0);
            font-size: 50px; /*how big it is*/
            font-weight: 400; /*how bold it is*/
            text-shadow: #bd44e2;
        }
    </style>
</head>
<body>
    <!--HTML comment-->
    <h1>CSS Example</h1>
    <p>An example of internal CSS</p>
</body>
</html>
